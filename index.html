<!doctype html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0d">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="description" content="Tactical Group Airsoft — operação, treino e comunidade.">
  <title>Tactical Group Airsoft</title>
  <link rel="stylesheet" href="/style.css?v=66">
  <link rel="stylesheet" href="/mobile-fixes.css?v=2">
  <link rel="stylesheet" href="/operator-fast.css?v=1">
  <link rel="stylesheet" href="/tga-suite-v3.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Tactical Group Airsoft"><img src="/logo.webp" alt="Tactical Group Airsoft"><span>Tactical <b>Airsoft</b></span><span id="instagramHeader" class="instagramHeader" aria-live="polite"></span></a>
    <button id="menuToggle" class="menuToggle" aria-label="Abrir menu" aria-expanded="false" type="button"><span></span><span></span><span></span></button>
    <nav id="nav"></nav>
  </header>
  <main id="app"><div class="loading">Carregando...</div></main>
  <footer>© 2026 Tactical Group Airsoft</footer>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw-v56.js?v=2"))}</script>
  <script>var ranks=['Recruta','Soldado','Cabo','3º Sargento','2º Sargento','1º Sargento','Subtenente','Aspirante','Tenente','Capitão','Major','Tenente-Coronel','Coronel'];</script>
  <script>window.renderFinancePage=window.renderFinancePage||async function(d){if(typeof window.financePanel!=='function')throw new Error('Financeiro ainda não carregou.');return window.financePanel(d)}</script>
  <script src="/blob-upload-router.js?v=1"></script>
  <script src="/api-lite-router-v4.js?v=1"></script>
  <script>
    (()=>{const p=(location.pathname.replace(/\/+$/,'')||'/');if(p.startsWith('/comandante')){const pre=document.createElement('script');pre.src='/commander-pages-v5.js?v=1';pre.async=false;document.body.appendChild(pre)}const s=document.createElement('script');s.src=p==='/operador/arena'?'/operator-minigames-v5.js?v=1':(p==='/operador/equipe'||p==='/operador/configuracoes')?'/operator-profile-v3.js?v=1':p.startsWith('/operador')?'/operator-dashboard-fast.js?v=4':'/app.js?v=72';s.async=false;document.body.appendChild(s)})();
  </script>
  <script>
    (()=>{const p=(location.pathname.replace(/\/+$/,'')||'/');if(!p.startsWith('/operador'))return;const ensure=()=>{const n=document.querySelector('.operatorNav');if(!n)return false;const g=n.querySelector('a[href="/operador/jogos"]');let m=n.querySelector('a[href="/operador/arena"]');if(!m){m=document.createElement('a');m.href='/operador/arena';m.textContent='Mini jogos';if(g)g.insertAdjacentElement('afterend',m);else n.appendChild(m)}else m.textContent='Mini jogos';m.classList.toggle('active',p==='/operador/arena');return true};ensure();const r=document.getElementById('app')||document.body;new MutationObserver(ensure).observe(r,{childList:true,subtree:true});let i=0,t=setInterval(()=>{i++;if(ensure()||i>80)clearInterval(t)},125)})();
  </script>
  <script>
    (()=>{const p=(location.pathname.replace(/\/+$/,'')||'/');if(p==='/operador/configuracoes'){for(const src of ['/operator-equipment-v3.js?v=1','/operator-arsenal-plus-v1.js?v=1']){const s=document.createElement('script');s.src=src;s.defer=true;document.body.appendChild(s)}}if(p==='/operador/configuracoes'||p==='/operador/equipe'){const s=document.createElement('script');s.src='/operator-replicas-v4.js?v=1';s.defer=true;document.body.appendChild(s)}if(!p.startsWith('/operador')){const s=document.createElement('script');s.src='/ui-route-fix.js?v=2';s.defer=true;document.body.appendChild(s)}if(p.startsWith('/comandante')){for(const src of ['/finance-v4-fix.js?v=1','/captain-rank-guard.js?v=1']){const s=document.createElement('script');s.src=src;s.defer=true;document.body.appendChild(s)}})();
  </script>
  <script>
    (()=>{const p=(location.pathname.replace(/\/+$/,'')||'/');if(p==='/comandante/jogos'||p.startsWith('/visita-jogo')){const s=document.createElement('script');s.src='/operations-features.js?v=6';s.defer=true;document.body.appendChild(s)}if(p==='/comandante/jogos'){const s=document.createElement('script');s.src='/commander-live-v3.js?v=1';s.defer=true;document.body.appendChild(s)}})();
  </script>
  <script>
    (()=>{const p=(location.pathname.replace(/\/+$/,'')||'/');if(p!=='/visitantes')return;const load=()=>{for(const src of ['/visitor-profile-mobile-fix.js?v=5','/mobile-public-profile.js?v=4','/operator-guardian-fix.js?v=3']){const s=document.createElement('script');s.src=src;s.defer=true;document.body.appendChild(s)}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load()})();
  </script>
</body>
</html>
