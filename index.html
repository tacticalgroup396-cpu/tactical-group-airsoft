<!doctype html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0d">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="description" content="Tactical Group Airsoft — operação, treino e comunidade.">
  <title>Tactical Group Airsoft</title>
  <link rel="stylesheet" href="/style.css?v=66">
  <link rel="stylesheet" href="/mobile-fixes.css?v=2">
  <link rel="stylesheet" href="/operator-fast.css?v=1">
  <link rel="stylesheet" href="/tga-suite-v3.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Tactical Group Airsoft"><img src="/logo.webp" alt="Tactical Group Airsoft"><span>Tactical <b>Airsoft</b></span><span id="instagramHeader" class="instagramHeader" aria-live="polite"></span></a>
    <button id="menuToggle" class="menuToggle" aria-label="Abrir menu" aria-expanded="false" type="button"><span></span><span></span><span></span></button>
    <nav id="nav"></nav>
  </header>
  <main id="app"><div class="loading">Carregando...</div></main>
  <footer>© 2026 Tactical Group Airsoft</footer>

  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw-v57.js?v=8"))}</script>
  <script>var ranks=['Recruta','Soldado','Cabo','3º Sargento','2º Sargento','1º Sargento','Subtenente','Aspirante','Tenente','Capitão','Major','Tenente-Coronel','Coronel'];</script>
  <script>window.renderFinancePage=window.renderFinancePage||async function(d){if(typeof window.financePanel!=='function')throw new Error('Financeiro ainda não carregou.');return window.financePanel(d)}</script>
  <script src="/blob-upload-router.js?v=1"></script>
  <script src="/api-lite-router.js?v=5"></script>

  <script>
    (()=>{
      const p=(location.pathname.replace(/\/+$/,'')||'/');
      if(p!=='/operador')return;
      const app=document.getElementById('app'),nav=document.getElementById('nav'),menu=document.getElementById('menuToggle');
      if(!app||!nav)return;
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const fmt=d=>{if(!d)return'';const s=String(d).slice(0,10),m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:s};
      const tm=t=>t?String(t).slice(0,5):'';
      const elo=n=>({1:'💎 Diamante',2:'🟩 Esmeralda',3:'🔷 Platina',4:'🏆 Ouro',5:'🥈 Prata',6:'🥉 Bronze',7:'⚙️ Ferro'}[Math.min(7,Math.max(1,Number(n)||7))]);
      const subnav=()=>`<div class="ofdNavWrap"><div class="operatorNav"><a class="active" href="/operador">Visão geral</a><a href="/operador/equipe">Ver operadores</a><a href="/operador/jogos">Jogos</a><a href="/operador/arena">Mini jogos</a><a href="/operador/configuracoes">Configurações</a></div></div>`;
      function top(u){
        nav.innerHTML=`<div class="navGroup"><a href="/visitantes">Equipe</a></div><div class="navGroup navAccess"><a class="active" href="/operador">Operador</a>${u?.role==='commander'?'<a href="/comandante">Comandante</a>':''}<button class="ghost" id="opEntryLogout" type="button">Sair</button></div>`;
        menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))});
        document.getElementById('opEntryLogout')?.addEventListener('click',async()=>{try{await fetch('/api/operator-dashboard?action=logout',{method:'POST',credentials:'same-origin',cache:'no-store'})}catch{}location.href='/'});
      }
      function base(){
        top(null);
        app.innerHTML=`<section class="ofdPage"><div class="ofdHero"><div class="ofdAvatar" id="opEntryAvatar">OP</div><div><div class="eyebrow">ÁREA DO OPERADOR</div><h1 id="opEntryTitle">Visão geral</h1><p id="opEntrySub">Área liberada. Carregando seus dados...</p></div></div>${subnav()}<section class="ofdCard"><div class="eyebrow">PROGRESSÃO</div><h2 id="opEntryProfile">Perfil do operador</h2><div class="ofdStats" id="opEntryStats"><span>Dados do perfil carregando em segundo plano.</span></div></section><section class="ofdCard"><div class="eyebrow">PRÓXIMOS JOGOS</div><h2>Presença e escalação</h2><div id="opEntryGames"><p class="muted">Buscando próximos jogos...</p></div><div class="heroActions"><a class="goldbtn" href="/operador/jogos">Abrir Jogos</a><a class="outlinebtn" href="/operador/arena">Abrir Mini jogos</a></div></section><section class="ofdCard"><div class="eyebrow">FINANCEIRO</div><div id="opEntryFinance"><p class="muted">Carregando situação financeira...</p></div></section></section>`;
      }
      async function get(url,timeout){const c=new AbortController(),id=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:c.signal});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.error||`Erro ${r.status}`);return d}finally{clearTimeout(id)}}
      function applyUser(u,instagram){if(!u)return;top(u);const lvl=Math.min(7,Math.max(1,Number(u.elo_level)||7));document.getElementById('opEntryTitle').textContent=u.nickname?`@${u.nickname}`:'Visão geral';document.getElementById('opEntrySub').textContent=u.name||'Operador ativo';const av=document.getElementById('opEntryAvatar');if(av){if(u.photo_url)av.outerHTML=`<img class="ofdPhoto" id="opEntryAvatar" src="${esc(u.photo_url)}" alt="Foto de ${esc(u.nickname||'operador')}">`;else av.textContent=String(u.nickname||'OP').slice(0,2).toUpperCase()}document.getElementById('opEntryProfile').textContent=`${u.rank||'Recruta'} · Elo ${lvl} ${elo(lvl)}`;document.getElementById('opEntryStats').innerHTML=`<span><b>${Number(u.games_count)||0}</b> jogos</span><span><b>${Number(u.absences)||0}</b> faltas</span><span><b>${u.age??'—'}</b> anos</span>`;if(instagram){const el=document.getElementById('instagramHeader');if(el)el.innerHTML=` · <a href="${esc(instagram)}" target="_blank" rel="noopener">Instagram</a>`}}
      function applyDashboard(d){if(d?.user)applyUser(d.user,d.instagram_url);const games=d?.games||[];const ge=document.getElementById('opEntryGames');if(ge)ge.innerHTML=games.length?games.slice(0,3).map(g=>`<article class="ofdGame"><div class="ofdGameHead"><div><div class="eyebrow">${fmt(g.game_date)}${g.game_time?' · '+tm(g.game_time):''}</div><h3>${esc(g.title||'Jogo')}</h3><p>${esc(g.field_name||g.location||'Campo não informado')}</p></div><span class="ofdResponse">${g.response==='going'?'✅ Vou':g.response==='not_going'?'❌ Não vou':'⏳ Não respondeu'}</span></div></article>`).join(''):'<p class="muted">Nenhum jogo ativo.</p>';const f=d?.finance,fe=document.getElementById('opEntryFinance');if(fe)fe.innerHTML=f?`<h2>${f.status==='paid'?'Mensalidade em dia':f.status==='waived'?'Mensalidade isenta':f.status==='overdue'?'Mensalidade atrasada':'Mensalidade pendente'}</h2><p>${Number(f.amount||0).toLocaleString('pt-BR',{style:'currency',currency:d.financeSettings?.currency||'BRL'})}${f.due_date?' · vencimento '+fmt(f.due_date):''}</p>`:'<p class="muted">Nenhuma cobrança ativa encontrada.</p>'}
      base();
      get('/api/light?action=op-me',5000).then(d=>applyUser(d.user,d.instagram_url)).catch(e=>{const s=document.getElementById('opEntrySub');if(s)s.textContent=e.name==='AbortError'?'Servidor demorou para responder. As abas continuam liberadas.':(e.message||'Não foi possível atualizar o perfil agora.');const st=document.getElementById('opEntryStats');if(st)st.innerHTML='<span>Use normalmente as abas acima.</span>'});
      get('/api/light?action=op-dashboard',8000).then(applyDashboard).catch(()=>{const g=document.getElementById('opEntryGames');if(g)g.innerHTML='<p class="muted">Os dados demoraram para responder. Abra a aba Jogos para continuar.</p>';const f=document.getElementById('opEntryFinance');if(f)f.innerHTML='<p class="muted">Financeiro temporariamente aguardando servidor.</p>'});
    })();
  </script>

  <script>
    (()=>{
      const p=(location.pathname.replace(/\/+$/,'')||'/');
      if(p==='/operador')return;
      if(p.startsWith('/comandante')){const pre=document.createElement('script');pre.src='/commander-pages-v5.js?v=1';pre.async=false;document.body.appendChild(pre)}
      const s=document.createElement('script');
      s.src=p==='/operador/arena'?'/operator-minigames-v5.js?v=1':(p==='/operador/equipe'||p==='/operador/configuracoes')?'/operator-profile-v3.js?v=1':p.startsWith('/operador')?'/operator-dashboard-fast.js?v=4':'/app.js?v=72';
      s.async=false;
      document.body.appendChild(s);
    })();
  </script>

  <script>
    (()=>{
      const p=(location.pathname.replace(/\/+$/,'')||'/');
      if(!p.startsWith('/operador'))return;
      const ensure=()=>{
        const n=document.querySelector('.operatorNav');if(!n)return false;
        const g=n.querySelector('a[href="/operador/jogos"]');
        let m=n.querySelector('a[href="/operador/arena"]');
        if(!m){m=document.createElement('a');m.href='/operador/arena';m.textContent='Mini jogos';if(g)g.insertAdjacentElement('afterend',m);else n.appendChild(m)}
        else m.textContent='Mini jogos';
        m.classList.toggle('active',p==='/operador/arena');
        return true
      };
      ensure();
      const r=document.getElementById('app')||document.body;
      new MutationObserver(ensure).observe(r,{childList:true,subtree:true});
      let i=0,t=setInterval(()=>{i++;if(ensure()||i>80)clearInterval(t)},125)
    })();
  </script>

  <script>
    (()=>{
      const p=(location.pathname.replace(/\/+$/,'')||'/');
      if(p==='/operador/configuracoes'){
        for(const src of ['/operator-equipment-v3.js?v=1','/operator-arsenal-plus-v1.js?v=1']){
          const s=document.createElement('script');s.src=src;s.defer=true;document.body.appendChild(s)
        }
      }
      if(p==='/operador/configuracoes'||p==='/operador/equipe'){
        const s=document.createElement('script');s.src='/operator-replicas-v4.js?v=1';s.defer=true;document.body.appendChild(s)
      }
      if(!p.startsWith('/operador')){
        const s=document.createElement('script');s.src='/ui-route-fix.js?v=2';s.defer=true;document.body.appendChild(s)
      }
      if(p.startsWith('/comandante')){
        for(const src of ['/finance-v4-fix.js?v=1','/captain-rank-guard.js?v=1']){
          const s=document.createElement('script');s.src=src;s.defer=true;document.body.appendChild(s)
        }
      }
    })();
  </script>

  <script>
    (()=>{
      const p=(location.pathname.replace(/\/+$/,'')||'/');
      if(p==='/comandante/jogos'||p.startsWith('/visita-jogo')){const s=document.createElement('script');s.src='/operations-features.js?v=6';s.defer=true;document.body.appendChild(s)}
      if(p==='/comandante/jogos'){const s=document.createElement('script');s.src='/commander-live-v3.js?v=1';s.defer=true;document.body.appendChild(s)}
    })();
  </script>

  <script>
    (()=>{
      const p=(location.pathname.replace(/\/+$/,'')||'/');if(p!=='/visitantes')return;
      const load=()=>{for(const src of ['/visitor-profile-mobile-fix.js?v=5','/mobile-public-profile.js?v=4','/operator-guardian-fix.js?v=3']){const s=document.createElement('script');s.src=src;s.defer=true;document.body.appendChild(s)}};
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load,{once:true});else load()
    })();
  </script>
</body>
</html>
