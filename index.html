<!doctype html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0d">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="description" content="Tactical Group Airsoft — operação, treino e comunidade.">
  <title>Tactical Group Airsoft</title>
  <link rel="stylesheet" href="/style.css?v=63">
  <link rel="stylesheet" href="/mobile-fixes.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Tactical Group Airsoft">
      <img src="/logo.webp" alt="Tactical Group Airsoft">
      <span>Tactical <b>Airsoft</b></span><span id="instagramHeader" class="instagramHeader" aria-live="polite"></span>
    </a>
    <button id="menuToggle" class="menuToggle" aria-label="Abrir menu" aria-expanded="false" type="button"><span></span><span></span><span></span></button>
    <nav id="nav"></nav>
  </header>
  <main id="app"><div class="loading">Carregando...</div></main>
  <footer>© 2026 Tactical Group Airsoft</footer>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js?v=58"))}</script>
  <script src="/app.js?v=63"></script>
  <script src="/operator-hotfix.js?v=6"></script>
  <script src="/operator-rescue.js?v=2"></script>
  <script src="/visitor-profile-mobile-fix.js?v=3"></script>
  <script src="/mobile-public-profile.js?v=1"></script>
  <script>
    (()=>{
      const escGuardian=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const enhance=()=>{
        if(location.pathname!=='/visitantes')return;
        const q=new URLSearchParams(location.search);
        const operator=q.get('operator');
        if(!operator)return;
        const profile=document.querySelector('.profilePanel');
        if(!profile)return;
        document.querySelector('.pageTitle')?.remove();
        document.querySelector('.sectionHead')?.remove();
        document.querySelector('.visitorGrid')?.remove();
        document.querySelector('.completedGamesPublic')?.remove();
        document.getElementById('visit')?.remove();
        profile.classList.add('publicProfileFocused');
        requestAnimationFrame(()=>window.scrollTo({top:0,behavior:'auto'}));
        if(profile.dataset.guardianLoaded==='1')return;
        profile.dataset.guardianLoaded='1';
        fetch('/api/public-operator?id='+encodeURIComponent(operator)+'&_t='+Date.now(),{cache:'no-store'})
          .then(r=>r.json()).then(info=>{
            const stats=profile.querySelector('.profileStats');
            if(!stats)return;
            const box=document.createElement('div');
            box.className='profileMinorInfo';
            if(info.minor){
              const guardian=info.guardian;
              box.innerHTML=`<div class="minorStatus"><span class="minorStatusIcon">⚠️</span><div><strong>Menor de idade</strong><small>Este operador possui menos de 18 anos.</small></div></div>${guardian?`<div class="guardianStatus"><div><strong>Responsável</strong><span>${guardian.nickname?'@'+escGuardian(guardian.nickname):escGuardian(guardian.name)}</span>${guardian.name?`<small>${escGuardian(guardian.name)}</small>`:''}${guardian.rank?`<small>${escGuardian(guardian.rank)}</small>`:''}</div></div>`:`<div class="guardianStatus"><div><strong>Responsável</strong><span>Não informado</span></div></div>`}`;
            }else{
              box.innerHTML='<div class="minorStatus"><span class="minorStatusIcon">✓</span><div><strong>Maior de idade</strong><small>Operador com 18 anos ou mais.</small></div></div>';
            }
            stats.insertAdjacentElement('afterend',box);
          }).catch(()=>{profile.dataset.guardianLoaded='0'});
      };
      const observer=new MutationObserver(enhance);
      observer.observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
      enhance();
    })();
  </script>
</body>
</html>
